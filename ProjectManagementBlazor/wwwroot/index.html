<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    window.drawBurndownChart = (burndownData) => {
        try {
            // Ждем появления canvas элемента
            const canvas = document.getElementById('burndownChart');
            if (!canvas) {
                console.log('Canvas элемент еще не загружен, повторная попытка через 100мс');
                setTimeout(() => window.drawBurndownChart(burndownData), 100);
                return;
            }

            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Не удалось получить контекст canvas');
                return;
            }

            if (!burndownData || burndownData.length === 0) {
                console.log('Нет данных для графика');
                return;
            }

            if (window.burndownChartInstance) {
                window.burndownChartInstance.destroy();
            }

            const dates = burndownData.map(d => {
                const date = new Date(d.date);
                return date.toLocaleDateString('ru-RU');
            });

            const remainingHours = burndownData.map(d => d.remainingHours);
            const idealRemaining = burndownData.map(d => d.idealRemainingHours);

            window.burndownChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Оставшиеся часы',
                            data: remainingHours,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: true,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Идеальный график',
                            data: idealRemaining,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.05)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.1,
                            fill: false,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                boxWidth: 10
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        },
                        title: {
                            display: true,
                            text: 'График сгорания задач (Burndown Chart)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Оставшиеся часы',
                                font: {
                                    weight: 'bold'
                                }
                            },
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Дата',
                                font: {
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });

            console.log('График успешно создан');
        } catch (error) {
            console.error('Ошибка при создании графика:', error);
        }
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    // Проверка загрузки Chart.js
    if (typeof Chart === 'undefined') {
        console.error('Chart.js не загружен!');
    } else {
        console.log('Chart.js загружен успешно');
    }
</script>

<script>
    document.addEventListener('dragover', function (event) {
        const dropZone = event.target.closest('.drop-zone');
        if (dropZone) {
            event.preventDefault();
        }
    });

    document.addEventListener('dragenter', function (event) {
        const dropZone = event.target.closest('.drop-zone');
        if (dropZone) {
            dropZone.classList.add('drag-over');
        }
    });

    document.addEventListener('dragleave', function (event) {
        const dropZone = event.target.closest('.drop-zone');
        if (dropZone && !dropZone.contains(event.relatedTarget)) {
            dropZone.classList.remove('drag-over');
        }
    });

    document.addEventListener('drop', function (event) {
        const dropZone = event.target.closest('.drop-zone');
        if (dropZone) {
            dropZone.classList.remove('drag-over');
        }
    });
</script>

<script>
    window.drawVelocityChart = (sprintHistory) => {
        try {
            const canvas = document.getElementById('velocityChart');
            if (!canvas) {
                setTimeout(() => window.drawVelocityChart(sprintHistory), 100);
                return;
            }

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            if (window.velocityChartInstance) {
                window.velocityChartInstance.destroy();
            }

            const labels = sprintHistory.map(s => s.sprintName);
            const completedPoints = sprintHistory.map(s => s.completedStoryPoints);
            const committedPoints = sprintHistory.map(s => s.totalStoryPoints);

            window.velocityChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Выполнено Story Points',
                            data: completedPoints,
                            backgroundColor: 'rgba(40, 167, 69, 0.7)',
                            borderColor: 'rgb(40, 167, 69)',
                            borderWidth: 1
                        },
                        {
                            label: 'Запланировано Story Points',
                            data: committedPoints,
                            backgroundColor: 'rgba(23, 162, 184, 0.7)',
                            borderColor: 'rgb(23, 162, 184)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: 'Velocity Chart' }
                    },
                    scales: {
                        y: {
                            title: { display: true, text: 'Story Points' },
                            beginAtZero: true
                        }
                    }
                }
            });
        } catch (error) {
            console.error('Ошибка создания графика Velocity:', error);
        }
    };

    window.downloadFile = (filename, base64Data) => {
        const link = document.createElement('a');
        const byteCharacters = atob(base64Data);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    };
</script>

<script>
    window.updateUnreadCount = (count) => {
        const badge = document.getElementById('unreadCountBadge');
        if (badge) {
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
    };
</script>
