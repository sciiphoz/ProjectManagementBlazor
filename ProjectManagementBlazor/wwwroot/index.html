<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="ProjectManagementBlazor.styles.css" rel="stylesheet" />

    <style>
        #app:not(.loaded) {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #F8F9FB;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

            #app:not(.loaded) .loading-container {
                text-align: center;
            }

            #app:not(.loaded) .loading-logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 1.5rem;
                background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%);
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 1.8rem;
                animation: logoPulse 2s ease-in-out infinite;
            }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        #app:not(.loaded) .loading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 0.25rem;
        }

        #app:not(.loaded) .loading-subtitle {
            font-size: 0.8rem;
            color: #64748B;
            margin-bottom: 1.5rem;
        }

        #app:not(.loaded) .loading-bar {
            width: 200px;
            height: 4px;
            background: #E2E8F0;
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
        }

        #app:not(.loaded) .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4F46E5, #818CF8);
            border-radius: 4px;
            width: 0%;
            animation: barGrow 2.5s ease-out forwards;
        }

        @keyframes barGrow {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        #app.loaded .loading-container {
            display: none !important;
        }

        @media (prefers-color-scheme: dark) {
            #app:not(.loaded) {
                background: #0F172A;
            }

                #app:not(.loaded) .loading-title {
                    color: #F1F5F9;
                }

                #app:not(.loaded) .loading-subtitle {
                    color: #94A3B8;
                }

                #app:not(.loaded) .loading-bar {
                    background: #334155;
                }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-logo">
                <i class="bi bi-kanban"></i>
            </div>
            <div class="loading-subtitle">Загрузка системы...</div>
            <div class="loading-bar">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                var app = document.getElementById('app');
                if (app) app.classList.add('loaded');
            }, 500);
        });
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>

<script>
    window.drawBurndownChart = (burndownData) => {
        try {
            const canvas = document.getElementById('burndownChart');
            if (!canvas) {
                setTimeout(() => window.drawBurndownChart(burndownData), 100);
                return;
            }

            if (window.burndownChartInstance) {
                window.burndownChartInstance.destroy();
            }

            if (!burndownData || burndownData.length === 0) {
                console.warn('Нет данных для бёрндаун-чарта');
                return; 
            }

            const dates = burndownData.map(d => new Date(d.date).toLocaleDateString('ru-RU'));
            const remaining = burndownData.map(d => d.remainingHours ?? 0);
            const ideal = burndownData.map(d => d.idealRemainingHours ?? 0);

            const allValues = [...remaining, ...ideal];
            let maxVal = Math.max(...allValues, 0);

            if (maxVal === 0) {
                maxVal = 1;
            }

            console.log('Burndown data received:', JSON.stringify(burndownData, null, 2));

            maxVal = Math.ceil(maxVal * 1.1);

            window.burndownChartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Оставшиеся часы',
                            data: remaining,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: true,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Идеальный график',
                            data: ideal,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.05)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.1,
                            fill: false,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                boxWidth: 10
                            }
                        },
                        title: {
                            display: true,
                            text: 'График сгорания задач',
                            font: { size: 14, weight: 'bold' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: maxVal,          
                            ticks: {
                                stepSize: Math.max(1, Math.floor(maxVal / 6)),
                                callback: function (value) {
                                    return value + ' ч.';
                                }
                            }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        } catch (error) {
            console.error('Ошибка Burndown:', error);
        }
    };
</script>

<script>
    window.drawCycleTimeChart = (cycleTimeData) => {
        try {
            const canvas = document.getElementById('cycleTimeChart');
            if (!canvas) {
                setTimeout(() => window.drawCycleTimeChart(cycleTimeData), 100);
                return;
            }

            if (!cycleTimeData || cycleTimeData.length === 0) return;

            if (window.cycleTimeChartInstance) {
                window.cycleTimeChartInstance.destroy();
                window.cycleTimeChartInstance = null;
            }

            const typeGroups = {};
            cycleTimeData.forEach(t => {
                const type = t.type || 'Other';
                if (!typeGroups[type]) {
                    typeGroups[type] = { count: 0, totalDays: 0 };
                }
                typeGroups[type].count++;
                typeGroups[type].totalDays += t.cycleDays;
            });

            const typeNames = {
                'UserStory': 'Истории',
                'Bug': 'Баг',
                'TechnicalTask': 'Тех. задача',
                'Improvement': 'Улучшение'
            };

            const keys = Object.keys(typeGroups);
            const labels = keys.map(k => typeNames[k] || k);
            const counts = keys.map(k => typeGroups[k].count);

            const colors = [
                'rgba(59, 130, 246, 0.9)',
                'rgba(239, 68, 68, 0.9)',
                'rgba(234, 179, 8, 0.9)',
                'rgba(34, 197, 94, 0.9)',
                'rgba(168, 85, 247, 0.9)'
            ];

            // Определяем, тёмная ли тема, по фону canvas или его родителя
            let isDark = false;

            // Проверяем ближайший родительский элемент с фоном
            let parent = canvas.parentElement;
            while (parent && !isDark) {
                const bgColor = getComputedStyle(parent).backgroundColor;
                if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== 'transparent') {
                    // Анализируем яркость фона
                    const rgb = bgColor.match(/\d+/g);
                    if (rgb && rgb.length >= 3) {
                        const brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
                        isDark = brightness < 128;
                    }
                    break;
                }
                parent = parent.parentElement;
            }

            // Резервный вариант — проверяем data-bs-theme
            if (!isDark) {
                const theme = document.documentElement.getAttribute('data-bs-theme');
                isDark = theme === 'dark';
            }

            const textColor = isDark ? '#CBD5E1' : '#334155';
            const borderColor = isDark ? '#1E293B' : '#FFFFFF';

            window.cycleTimeChartInstance = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: borderColor,
                        borderWidth: 3,
                        hoverBorderWidth: 4,
                        hoverBorderColor: borderColor
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    cutout: '50%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            align: 'center',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                boxWidth: 14,
                                boxHeight: 14,
                                generateLabels: function (chart) {
                                    const data = chart.data;
                                    if (data.labels.length && data.datasets.length) {
                                        return data.labels.map((label, i) => {
                                            const key = keys[i];
                                            const avg = (typeGroups[key].totalDays / typeGroups[key].count).toFixed(1);
                                            return {
                                                text: `${label}: ${typeGroups[key].count} шт. (≈${avg} дн.)`,
                                                fillStyle: data.datasets[0].backgroundColor[i],
                                                strokeStyle: data.datasets[0].backgroundColor[i],
                                                lineWidth: 0,
                                                hidden: false,
                                                index: i,
                                                pointStyle: 'circle',
                                                rotation: 0
                                            };
                                        });
                                    }
                                    return [];
                                },
                                font: {
                                    size: 12,
                                    weight: '500'
                                },
                                color: textColor
                            }
                        },
                        title: {
                            display: true,
                            text: 'Распределение задач по типам',
                            font: {
                                size: 15,
                                weight: 'bold'
                            },
                            color: textColor,
                            padding: { bottom: 10 }
                        },
                        tooltip: {
                            backgroundColor: isDark ? 'rgba(30, 41, 59, 0.98)' : 'rgba(15, 23, 42, 0.95)',
                            titleColor: '#F8FAFC',
                            bodyColor: '#E2E8F0',
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            padding: 12,
                            cornerRadius: 8,
                            callbacks: {
                                label: (context) => {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.parsed / total) * 100).toFixed(1);
                                    const key = keys[context.dataIndex];
                                    const avg = (typeGroups[key].totalDays / typeGroups[key].count).toFixed(1);
                                    return `Задач: ${context.parsed} (${percentage}%) | ≈${avg} дн.`;
                                }
                            }
                        }
                    }
                }
            });
        } catch (error) {
            console.error('CycleTime: ошибка', error);
        }
    };
</script>

<script>
    let ganttDrawAttempt = 0;
    window.drawGanttChart = (tasks, sprintStartDate, sprintEndDate) => {
        try {
            const canvas = document.getElementById('ganttChart');
            if (!canvas) {
                if (++ganttDrawAttempt < 5) setTimeout(() => window.drawGanttChart(tasks, sprintStartDate, sprintEndDate), 200);
                return;
            }
            if (window.ganttChartInstance) {
                window.ganttChartInstance.destroy();
                window.ganttChartInstance = null;
            }
            if (!tasks || tasks.length === 0) {
                ganttDrawAttempt = 0;
                return;
            }

            const taskCount = tasks.length;
            const rowHeight = 44;
            const minHeight = Math.max(400, taskCount * rowHeight + 100);
            canvas.style.height = minHeight + 'px';
            if (canvas.parentElement) canvas.parentElement.style.height = minHeight + 'px';

            const getColor = s => ({
                'Done': { bg: 'rgba(34, 197, 94, 0.9)', border: 'rgb(22, 163, 74)' },
                'InProgress': { bg: 'rgba(234, 179, 8, 0.9)', border: 'rgb(202, 138, 4)' },
                'ToDo': { bg: 'rgba(148, 163, 184, 0.85)', border: 'rgb(100, 116, 139)' }
            }[s] || { bg: 'rgba(203, 213, 225, 0.85)', border: 'rgb(148, 163, 184)' });

            const getStatusText = s => ({
                'Done': 'Выполнено',
                'InProgress': 'В работе',
                'ToDo': 'К выполнению'
            }[s] || s);

            const sortedTasks = [...tasks].sort((a, b) => {
                const order = { 'Done': 0, 'InProgress': 1, 'ToDo': 2 };
                return (order[a.status] || 3) - (order[b.status] || 3);
            });

            const labels = sortedTasks.map(t => t.title.length > 30 ? t.title.substring(0, 28) + '…' : t.title);
            const sprintStart = new Date(sprintStartDate).getTime();
            const sprintEnd = new Date(sprintEndDate).getTime();

            // Один датасет с плавающими барами — классический подход для Ганта
            const datasets = [{
                label: 'Задачи',
                data: sortedTasks.map((t, i) => ({
                    x: [new Date(t.startDate).getTime(), new Date(t.endDate).getTime()],
                    y: labels[i]
                })),
                backgroundColor: sortedTasks.map(t => getColor(t.status).bg),
                borderColor: sortedTasks.map(t => getColor(t.status).border),
                borderWidth: 2,
                borderRadius: 8,
                borderSkipped: false,
                barPercentage: 0.85,
                categoryPercentage: 0.9,
                taskInfo: sortedTasks
            }];

            window.ganttChartInstance = new Chart(canvas, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: {
                        xAxisKey: 'x',
                        yAxisKey: 'y'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30, 41, 59, 0.95)',
                            titleColor: '#F8FAFC',
                            bodyColor: '#CBD5E1',
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            padding: 14,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                title: (items) => {
                                    if (!items.length) return '';
                                    const idx = items[0].dataIndex;
                                    return sortedTasks[idx]?.title || '';
                                },
                                label: (context) => {
                                    const t = sortedTasks[context.dataIndex];
                                    return [
                                        `Статус: ${getStatusText(t.status)}`,
                                        `SP: ${t.storyPoints} | ${t.estimatedHours} ч.`,
                                        `Исполнитель: ${t.assignee}`
                                    ];
                                }
                            }
                        },
                        title: {
                            display: true,
                            text: 'Диаграмма Ганта',
                            font: { size: 18, weight: 'bold' },
                            color: '#475569',
                            padding: { bottom: 20 }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: sprintStart,
                            max: sprintEnd,
                            grid: { color: 'rgba(148, 163, 184, 0.12)' },
                            ticks: {
                                callback: v => new Date(v).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }),
                                maxTicksLimit: 8,
                                font: { size: 12, weight: '500' },
                                color: '#64748B'
                            }
                        },
                        y: {
                            grid: { display: false },
                            ticks: {
                                font: { size: 13, weight: '500' },
                                color: '#475569',
                                padding: 10
                            }
                        }
                    }
                }
            });
            ganttDrawAttempt = 0;
        } catch (error) {
            console.error('Ошибка Ганта:', error.message);
            ganttDrawAttempt = 0;
        }
    };
</script>

<script>
    window.drawBurndownTrendChart = (sprintData) => {
        try {
            const canvas = document.getElementById('burndownTrendChart');
            if (!canvas) { setTimeout(() => window.drawBurndownTrendChart(sprintData), 100); return; }
            if (window.burndownTrendChartInstance) window.burndownTrendChartInstance.destroy();
            if (!sprintData || sprintData.length === 0) return;

            window.burndownTrendChartInstance = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: sprintData.map(s => s.sprintName),
                    datasets: [
                        { label: 'Факт %', data: sprintData.map(s => s.completionPercentage), backgroundColor: 'rgba(40,167,69,0.7)', borderColor: 'rgb(40,167,69)', borderWidth: 1 },
                        { label: 'Идеал %', data: sprintData.map(s => s.idealCompletionPercentage), type: 'line', borderColor: 'rgb(23,162,184)', borderDash: [5, 5], pointRadius: 4, fill: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' }, title: { display: true, text: 'Сравнение спринтов' } },
                    scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
                }
            });
        } catch (error) { console.error('Ошибка Burndown Trend:', error); }
    };
</script>

<script>
    window.triggerDownload = (fileName, base64Content, mimeType) => {
        const link = document.createElement('a');
        link.href = `data:${mimeType};base64,${base64Content}`;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
</script>

<script>
    window.shakeElement = (elementClass) => {
        const el = document.querySelector('.' + elementClass);
        if (el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); }
    };
</script>

<script>
    document.addEventListener('dragover', e => { if (e.target.closest('.drop-zone')) e.preventDefault(); });
    document.addEventListener('dragenter', e => { const d = e.target.closest('.drop-zone'); if (d) d.classList.add('drag-over'); });
    document.addEventListener('dragleave', e => { const d = e.target.closest('.drop-zone'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('drag-over'); });
    document.addEventListener('drop', e => { const d = e.target.closest('.drop-zone'); if (d) d.classList.remove('drag-over'); });
</script>
