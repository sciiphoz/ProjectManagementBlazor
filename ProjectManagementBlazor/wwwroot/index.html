<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="ProjectManagementBlazor.styles.css" rel="stylesheet" />

    <style>
        #app:not(.loaded) {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #F8F9FB;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

            #app:not(.loaded) .loading-container {
                text-align: center;
            }

            #app:not(.loaded) .loading-logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 1.5rem;
                background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%);
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 1.8rem;
                animation: logoPulse 2s ease-in-out infinite;
            }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        #app:not(.loaded) .loading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 0.25rem;
        }

        #app:not(.loaded) .loading-subtitle {
            font-size: 0.8rem;
            color: #64748B;
            margin-bottom: 1.5rem;
        }

        #app:not(.loaded) .loading-bar {
            width: 200px;
            height: 4px;
            background: #E2E8F0;
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
        }

        #app:not(.loaded) .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4F46E5, #818CF8);
            border-radius: 4px;
            width: 0%;
            animation: barGrow 2.5s ease-out forwards;
        }

        @keyframes barGrow {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        #app:not(.loaded) .loading-percentage {
            font-size: 0.75rem;
            color: #94A3B8;
            margin-top: 0.5rem;
        }

        #app.loaded .loading-container,
        #app.loaded .loading-progress,
        #app.loaded .loading-progress-text {
            display: none !important;
        }

        @media (prefers-color-scheme: dark) {
            #app:not(.loaded) {
                background: #0F172A;
            }

                #app:not(.loaded) .loading-title {
                    color: #F1F5F9;
                }

                #app:not(.loaded) .loading-subtitle {
                    color: #94A3B8;
                }

                #app:not(.loaded) .loading-bar {
                    background: #334155;
                }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-logo">
                <i class="bi bi-kanban"></i>
            </div>
            <div class="loading-title">Project Management</div>
            <div class="loading-subtitle">Загрузка системы...</div>
            <div class="loading-bar">
                <div class="loading-bar-fill"></div>
            </div>
            <div class="loading-percentage" id="loading-percentage">0%</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        (function () {
            var percent = 0;
            var el = document.getElementById('loading-percentage');
            var interval = setInterval(function () {
                percent += Math.floor(Math.random() * 15) + 5;
                if (percent > 95) {
                    percent = 95;
                    clearInterval(interval);
                }
                if (el) el.textContent = percent + '%';
            }, 300);
        })();

        window.addEventListener('load', function () {
            setTimeout(function () {
                var app = document.getElementById('app');
                if (app) app.classList.add('loaded');
            }, 500);
        });
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
    if (typeof Chart === 'undefined') {
        console.error('Chart.js не загружен!');
    } else {
        console.log('Chart.js загружен успешно');
    }
</script>

<script>
    window.drawBurndownChart = (burndownData) => {
        try {
            const canvas = document.getElementById('burndownChart');
            if (!canvas) {
                setTimeout(() => window.drawBurndownChart(burndownData), 100);
                return;
            }

            if (window.burndownChartInstance) {
                window.burndownChartInstance.destroy();
            }

            if (!burndownData || burndownData.length === 0) return;

            const dates = burndownData.map(d => new Date(d.date).toLocaleDateString('ru-RU'));
            const remainingHours = burndownData.map(d => d.remainingHours);
            const idealRemaining = burndownData.map(d => d.idealRemainingHours);

            window.burndownChartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Оставшиеся часы',
                            data: remainingHours,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            borderWidth: 2, tension: 0.1, fill: true,
                            pointRadius: 4, pointHoverRadius: 6
                        },
                        {
                            label: 'Идеальный график',
                            data: idealRemaining,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.05)',
                            borderWidth: 2, borderDash: [5, 5],
                            tension: 0.1, fill: false,
                            pointRadius: 2, pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 10 } },
                        title: { display: true, text: 'Burndown Chart', font: { size: 14, weight: 'bold' } }
                    },
                    scales: {
                        y: { beginAtZero: true },
                        x: { grid: { display: false } }
                    }
                }
            });
        } catch (error) {
            console.error('Ошибка Burndown:', error);
        }
    };
</script>

<script>
    window.drawVelocityChart = (sprintHistory) => {
        try {
            const canvas = document.getElementById('velocityChart');
            if (!canvas) { setTimeout(() => window.drawVelocityChart(sprintHistory), 100); return; }
            if (!sprintHistory || sprintHistory.length === 0) return;
            if (window.velocityChartInstance) window.velocityChartInstance.destroy();

            window.velocityChartInstance = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: sprintHistory.map(s => s.sprintName),
                    datasets: [
                        { label: 'Выполнено SP', data: sprintHistory.map(s => s.completedStoryPoints), backgroundColor: 'rgba(40,167,69,0.7)', borderColor: 'rgb(40,167,69)', borderWidth: 1 },
                        { label: 'Запланировано SP', data: sprintHistory.map(s => s.totalStoryPoints), backgroundColor: 'rgba(23,162,184,0.7)', borderColor: 'rgb(23,162,184)', borderWidth: 1 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: { legend: { position: 'top' }, title: { display: true, text: 'Velocity Chart' } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        } catch (error) {
            console.error('Ошибка Velocity:', error);
        }
    };
</script>

<script>
    let ganttDrawAttempt = 0;
    window.drawGanttChart = (tasks, sprintStartDate, sprintEndDate) => {
        try {
            const canvas = document.getElementById('ganttChart');
            if (!canvas) { if (++ganttDrawAttempt < 5) setTimeout(() => window.drawGanttChart(tasks, sprintStartDate, sprintEndDate), 200); return; }
            if (window.ganttChartInstance) { window.ganttChartInstance.destroy(); window.ganttChartInstance = null; }
            if (!tasks || tasks.length === 0) { ganttDrawAttempt = 0; return; }

            const getColor = s => ({ 'Done': { bg: 'rgba(40,167,69,0.7)', border: 'rgb(40,167,69)' }, 'InProgress': { bg: 'rgba(255,193,7,0.7)', border: 'rgb(255,193,7)' }, 'ToDo': { bg: 'rgba(108,117,125,0.7)', border: 'rgb(108,117,125)' } }[s] || { bg: 'rgba(173,181,189,0.7)', border: 'rgb(173,181,189)' });
            const getStatusText = s => ({ 'Done': 'Выполнено', 'InProgress': 'В работе', 'ToDo': 'К выполнению' }[s] || s);

            const datasets = tasks.map((t, i) => {
                const c = getColor(t.status);
                return {
                    label: t.title,
                    data: [{ x: [new Date(t.startDate).getTime(), new Date(t.endDate).getTime()], y: i }],
                    backgroundColor: c.bg, borderColor: c.border, borderWidth: 1, borderRadius: 3, borderSkipped: false,
                    taskInfo: t
                };
            }).reverse();

            window.ganttChartInstance = new Chart(canvas, {
                type: 'bar',
                data: { labels: tasks.map(t => t.title).reverse(), datasets },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { title: i => i[0].dataset.taskInfo.fullTitle, label: c => { const t = c.dataset.taskInfo; return [`Статус: ${getStatusText(t.status)}`, `SP: ${t.storyPoints}`, `${t.estimatedHours} ч.`, t.assignee]; } } },
                        title: { display: true, text: 'Диаграмма Ганта', font: { size: 14, weight: 'bold' } }
                    },
                    scales: {
                        x: { type: 'linear', min: new Date(sprintStartDate).getTime(), max: new Date(sprintEndDate).getTime(), ticks: { callback: v => new Date(v).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }), maxTicksLimit: 10 } }
                    }
                }
            });
            ganttDrawAttempt = 0;
        } catch (error) { console.error('Ошибка Ганта:', error.message); ganttDrawAttempt = 0; }
    };
</script>

<script>
    window.drawBurndownTrendChart = (sprintData) => {
        try {
            const canvas = document.getElementById('burndownTrendChart');
            if (!canvas) { setTimeout(() => window.drawBurndownTrendChart(sprintData), 100); return; }
            if (window.burndownTrendChartInstance) window.burndownTrendChartInstance.destroy();
            if (!sprintData || sprintData.length === 0) return;

            window.burndownTrendChartInstance = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: sprintData.map(s => s.sprintName),
                    datasets: [
                        { label: 'Факт %', data: sprintData.map(s => s.completionPercentage), backgroundColor: 'rgba(40,167,69,0.7)', borderColor: 'rgb(40,167,69)', borderWidth: 1 },
                        { label: 'Идеал %', data: sprintData.map(s => s.idealCompletionPercentage), type: 'line', borderColor: 'rgb(23,162,184)', borderDash: [5, 5], pointRadius: 4, fill: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' }, title: { display: true, text: 'Сравнение спринтов' } },
                    scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
                }
            });
        } catch (error) { console.error('Ошибка Burndown Trend:', error); }
    };
</script>

<script>
    window.shakeElement = (elementClass) => {
        const el = document.querySelector('.' + elementClass);
        if (el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); }
    };
</script>

<script>
    document.addEventListener('dragover', e => { if (e.target.closest('.drop-zone')) e.preventDefault(); });
    document.addEventListener('dragenter', e => { const d = e.target.closest('.drop-zone'); if (d) d.classList.add('drag-over'); });
    document.addEventListener('dragleave', e => { const d = e.target.closest('.drop-zone'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('drag-over'); });
    document.addEventListener('drop', e => { const d = e.target.closest('.drop-zone'); if (d) d.classList.remove('drag-over'); });
</script>
