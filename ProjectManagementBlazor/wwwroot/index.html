<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="ProjectManagementBlazor.styles.css" rel="stylesheet" />

    <style>
        #app:not(.loaded) {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #F8F9FB;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

            #app:not(.loaded) .loading-container {
                text-align: center;
            }

            #app:not(.loaded) .loading-logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 1.5rem;
                background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%);
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 1.8rem;
                animation: logoPulse 2s ease-in-out infinite;
            }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        #app:not(.loaded) .loading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 0.25rem;
        }

        #app:not(.loaded) .loading-subtitle {
            font-size: 0.8rem;
            color: #64748B;
            margin-bottom: 1.5rem;
        }

        #app:not(.loaded) .loading-bar {
            width: 200px;
            height: 4px;
            background: #E2E8F0;
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
        }

        #app:not(.loaded) .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4F46E5, #818CF8);
            border-radius: 4px;
            width: 0%;
            animation: barGrow 2.5s ease-out forwards;
        }

        @keyframes barGrow {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        #app.loaded .loading-container {
            display: none !important;
        }

        @media (prefers-color-scheme: dark) {
            #app:not(.loaded) {
                background: #0F172A;
            }

                #app:not(.loaded) .loading-title {
                    color: #F1F5F9;
                }

                #app:not(.loaded) .loading-subtitle {
                    color: #94A3B8;
                }

                #app:not(.loaded) .loading-bar {
                    background: #334155;
                }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-logo">
                <i class="bi bi-kanban"></i>
            </div>
            <div class="loading-subtitle">Загрузка системы...</div>
            <div class="loading-bar">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                var app = document.getElementById('app');
                if (app) app.classList.add('loaded');
            }, 500);
        });
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>

<script>
    window.drawBurndownChart = (burndownData) => {
        try {
            const canvas = document.getElementById('burndownChart');
            if (!canvas) {
                setTimeout(() => window.drawBurndownChart(burndownData), 100);
                return;
            }

            if (window.burndownChartInstance) {
                window.burndownChartInstance.destroy();
            }

            if (!burndownData || burndownData.length === 0) {
                console.warn('Нет данных для бёрндаун-чарта');
                return; 
            }

            const dates = burndownData.map(d => new Date(d.date).toLocaleDateString('ru-RU'));
            const remaining = burndownData.map(d => d.remainingHours ?? 0);
            const ideal = burndownData.map(d => d.idealRemainingHours ?? 0);

            const allValues = [...remaining, ...ideal];
            let maxVal = Math.max(...allValues, 0);

            if (maxVal === 0) {
                maxVal = 1;
            }

            console.log('Burndown data received:', JSON.stringify(burndownData, null, 2));

            maxVal = Math.ceil(maxVal * 1.1);

            window.burndownChartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Оставшиеся часы',
                            data: remaining,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: true,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Идеальный график',
                            data: ideal,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.05)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.1,
                            fill: false,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                boxWidth: 10
                            }
                        },
                        title: {
                            display: true,
                            text: 'График сгорания задач',
                            font: { size: 14, weight: 'bold' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: maxVal,          
                            ticks: {
                                stepSize: Math.max(1, Math.floor(maxVal / 6)),
                                callback: function (value) {
                                    return value + ' ч.';
                                }
                            }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        } catch (error) {
            console.error('Ошибка Burndown:', error);
        }
    };
</script>

<script>
    window.drawCycleTimeChart = (cycleTimeData) => {
        try {
            const canvas = document.getElementById('cycleTimeChart');
            if (!canvas) {
                setTimeout(() => window.drawCycleTimeChart(cycleTimeData), 100);
                return;
            }

            if (!cycleTimeData || cycleTimeData.length === 0) return;

            if (window.cycleTimeChartInstance) {
                window.cycleTimeChartInstance.destroy();
                window.cycleTimeChartInstance = null;
            }

            const typeGroups = {};
            cycleTimeData.forEach(t => {
                const type = t.type || 'Other';
                if (!typeGroups[type]) {
                    typeGroups[type] = { count: 0, totalDays: 0 };
                }
                typeGroups[type].count++;
                typeGroups[type].totalDays += t.cycleDays;
            });

            const typeNames = {
                'UserStory': 'Истории',
                'Bug': 'Баг',
                'TechnicalTask': 'Тех. задача',
                'Improvement': 'Улучшение'
            };

            const keys = Object.keys(typeGroups);
            const labels = keys.map(k => typeNames[k] || k);
            const counts = keys.map(k => typeGroups[k].count);

            const colors = [
                'rgba(59, 130, 246, 0.9)',
                'rgba(239, 68, 68, 0.9)',
                'rgba(234, 179, 8, 0.9)',
                'rgba(34, 197, 94, 0.9)',
                'rgba(168, 85, 247, 0.9)'
            ];

            // Определяем, тёмная ли тема, по фону canvas или его родителя
            let isDark = false;

            // Проверяем ближайший родительский элемент с фоном
            let parent = canvas.parentElement;
            while (parent && !isDark) {
                const bgColor = getComputedStyle(parent).backgroundColor;
                if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== 'transparent') {
                    // Анализируем яркость фона
                    const rgb = bgColor.match(/\d+/g);
                    if (rgb && rgb.length >= 3) {
                        const brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
                        isDark = brightness < 128;
                    }
                    break;
                }
                parent = parent.parentElement;
            }

            // Резервный вариант — проверяем data-bs-theme
            if (!isDark) {
                const theme = document.documentElement.getAttribute('data-bs-theme');
                isDark = theme === 'dark';
            }

            const textColor = isDark ? '#CBD5E1' : '#334155';
            const borderColor = isDark ? '#1E293B' : '#FFFFFF';

            window.cycleTimeChartInstance = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: borderColor,
                        borderWidth: 3,
                        hoverBorderWidth: 4,
                        hoverBorderColor: borderColor
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    cutout: '50%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            align: 'center',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                boxWidth: 14,
                                boxHeight: 14,
                                generateLabels: function (chart) {
                                    const data = chart.data;
                                    if (data.labels.length && data.datasets.length) {
                                        return data.labels.map((label, i) => {
                                            const key = keys[i];
                                            const avg = (typeGroups[key].totalDays / typeGroups[key].count).toFixed(1);
                                            return {
                                                text: `${label}: ${typeGroups[key].count} шт. (≈${avg} дн.)`,
                                                fillStyle: data.datasets[0].backgroundColor[i],
                                                strokeStyle: data.datasets[0].backgroundColor[i],
                                                lineWidth: 0,
                                                hidden: false,
                                                index: i,
                                                pointStyle: 'circle',
                                                rotation: 0
                                            };
                                        });
                                    }
                                    return [];
                                },
                                font: {
                                    size: 12,
                                    weight: '500'
                                },
                                color: textColor
                            }
                        },
                        title: {
                            display: true,
                            text: 'Распределение задач по типам',
                            font: {
                                size: 15,
                                weight: 'bold'
                            },
                            color: textColor,
                            padding: { bottom: 10 }
                        },
                        tooltip: {
                            backgroundColor: isDark ? 'rgba(30, 41, 59, 0.98)' : 'rgba(15, 23, 42, 0.95)',
                            titleColor: '#F8FAFC',
                            bodyColor: '#E2E8F0',
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            padding: 12,
                            cornerRadius: 8,
                            callbacks: {
                                label: (context) => {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.parsed / total) * 100).toFixed(1);
                                    const key = keys[context.dataIndex];
                                    const avg = (typeGroups[key].totalDays / typeGroups[key].count).toFixed(1);
                                    return `Задач: ${context.parsed} (${percentage}%) | ≈${avg} дн.`;
                                }
                            }
                        }
                    }
                }
            });
        } catch (error) {
            console.error('CycleTime: ошибка', error);
        }
    };
</script>

<script>
    window.drawGanttChart = (tasks, sprintStartDate, sprintEndDate) => {
        try {
            const canvas = document.getElementById('ganttChart');
            if (!canvas) {
                setTimeout(() => window.drawGanttChart(tasks, sprintStartDate, sprintEndDate), 200);
                return;
            }

            if (window.ganttChartInstance) {
                window.ganttChartInstance.destroy();
                window.ganttChartInstance = null;
            }

            if (!tasks || tasks.length === 0) {
                console.warn('Нет задач для диаграммы Ганта');
                return;
            }

            const sprintStart = new Date(sprintStartDate).getTime();
            const sprintEnd = new Date(sprintEndDate).getTime();
            const today = new Date().getTime();

            const sortedTasks = [...tasks].sort((a, b) => {
                const aStart = a.startedAt ? new Date(a.startedAt).getTime() : Infinity;
                const bStart = b.startedAt ? new Date(b.startedAt).getTime() : Infinity;
                return aStart - bStart;
            });

            const labels = [];
            const startDates = [];
            const endDates = [];
            const colors = [];
            const taskInfo = [];

            sortedTasks.forEach(task => {
                let start = sprintStart;
                if (task.startedAt) {
                    const parsed = new Date(task.startedAt).getTime();
                    start = Math.max(parsed, sprintStart);
                }

                let end = sprintEnd;
                if (task.completedAt) {
                    const parsed = new Date(task.completedAt).getTime();
                    end = Math.min(parsed, sprintEnd);
                    if (end < start) end = start;
                } else if (task.status === 'InProgress' || task.status === 'Review') {
                    end = Math.min(today, sprintEnd);
                    if (end < start) end = start; // На случай если "сегодня" меньше старта спринта в логах
                } else if (task.status === 'ToDo' && task.estimatedHours) {
                    const days = Math.ceil(task.estimatedHours / 8);
                    end = start + days * 24 * 60 * 60 * 1000;
                    end = Math.min(end, sprintEnd);
                }

                if (start > end) return;

                // Красивое усечение длинных названий для оси Y
                labels.push(task.title.length > 30 ? task.title.substring(0, 28) + '…' : task.title);
                startDates.push(start);
                endDates.push(end);

                const statusColors = {
                    'Done': { bg: 'rgba(34, 197, 94, 0.85)' },
                    'InProgress': { bg: 'rgba(234, 179, 8, 0.85)' },
                    'Review': { bg: 'rgba(139, 92, 246, 0.85)' },
                    'ToDo': { bg: 'rgba(148, 163, 184, 0.75)' }
                };
                const color = statusColors[task.status] || statusColors['ToDo'];
                colors.push(color.bg);

                taskInfo.push({
                    title: task.title,
                    assignee: task.assignee ? task.assignee.fullName : 'Не назначен',
                    status: task.status,
                    storyPoints: task.storyPoints,
                    estimatedHours: task.estimatedHours
                });
            });

            if (labels.length === 0) {
                console.warn('Нет задач для отображения на временной шкале');
                return;
            }

            const ctx = canvas.getContext('2d');
            window.ganttChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Задачи',
                        data: startDates.map((start, i) => ({
                            x: [start, endDates[i]],
                            y: labels[i]
                        })),
                        backgroundColor: colors,
                        borderColor: colors.map(c => c.replace('0.85', '1.0').replace('0.75', '1.0')),
                        borderWidth: 1,
                        borderRadius: 4, // Небольшое скругление плашек выглядит современно
                        borderSkipped: false,
                        barPercentage: 0.7,
                        categoryPercentage: 0.8
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: {
                        xAxisKey: 'x',
                        yAxisKey: 'y'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                generateLabels: function () {
                                    return [
                                        { text: 'Выполнено', fillStyle: 'rgba(34, 197, 94, 0.85)', strokeStyle: 'rgb(34, 197, 94)', lineWidth: 1, pointStyle: 'rectRounded' },
                                        { text: 'В работе', fillStyle: 'rgba(234, 179, 8, 0.85)', strokeStyle: 'rgb(234, 179, 8)', lineWidth: 1, pointStyle: 'rectRounded' },
                                        { text: 'На проверке', fillStyle: 'rgba(139, 92, 246, 0.85)', strokeStyle: 'rgb(139, 92, 246)', lineWidth: 1, pointStyle: 'rectRounded' },
                                        { text: 'К выполнению', fillStyle: 'rgba(148, 163, 184, 0.75)', strokeStyle: 'rgb(148, 163, 184)', lineWidth: 1, pointStyle: 'rectRounded' }
                                    ];
                                },
                                usePointStyle: true,
                                boxWidth: 12,
                                padding: 15,
                                font: { size: 12, weight: '500' }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30, 41, 59, 0.95)',
                            titleColor: '#F8FAFC',
                            bodyColor: '#CBD5E1',
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 12 },
                            padding: 12,
                            cornerRadius: 6,
                            displayColors: false,
                            callbacks: {
                                title: function (items) {
                                    if (!items.length) return '';
                                    return taskInfo[items[0].dataIndex]?.title || '';
                                },
                                label: function (context) {
                                    const idx = context.dataIndex;
                                    const info = taskInfo[idx];
                                    const startDateText = new Date(startDates[idx]).toLocaleDateString('ru-RU');
                                    const endDateText = new Date(endDates[idx]).toLocaleDateString('ru-RU');
                                    const days = Math.round((endDates[idx] - startDates[idx]) / (1000 * 60 * 60 * 24));

                                    const statusMap = {
                                        'Done': 'Выполнено',
                                        'InProgress': 'В работе',
                                        'Review': 'На проверке',
                                        'ToDo': 'К выполнению'
                                    };

                                    return [
                                        `Статус: ${statusMap[info.status] || info.status}`,
                                        `Исполнитель: ${info.assignee}`,
                                        `Story Points: ${info.storyPoints || 0}`,
                                        `Оценка: ${info.estimatedHours || 0} ч.`,
                                        `Период: ${startDateText} – ${endDateText} (${days} дн.)`
                                    ];
                                }
                            }
                        },
                        title: {
                            display: true,
                            text: 'Временная шкала спринта (Диаграмма Ганта)',
                            font: { size: 16, weight: 'bold' },
                            color: '#334155',
                            padding: { bottom: 15 }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: sprintStart,
                            max: sprintEnd,
                            grid: { color: 'rgba(148, 163, 184, 0.1)' },
                            ticks: {
                                callback: function (value) {
                                    return new Date(value).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                                },
                                maxTicksLimit: 12,
                                font: { size: 11 },
                                color: '#64748B'
                            }
                        },
                        y: {
                            grid: { display: false },
                            ticks: {
                                font: { size: 12 },
                                color: '#334155',
                                padding: 8
                            }
                        }
                    }
                }
            });

        } catch (error) {
            console.error('Ошибка отрисовки диаграммы Ганта:', error);
        }
    };
</script>

<script>
    window.drawBurndownTrendChart = (sprintData) => {
        try {
            const canvas = document.getElementById('burndownTrendChart');
            if (!canvas) { setTimeout(() => window.drawBurndownTrendChart(sprintData), 100); return; }
            if (window.burndownTrendChartInstance) window.burndownTrendChartInstance.destroy();
            if (!sprintData || sprintData.length === 0) return;

            window.burndownTrendChartInstance = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: sprintData.map(s => s.sprintName),
                    datasets: [
                        { label: 'Факт %', data: sprintData.map(s => s.completionPercentage), backgroundColor: 'rgba(40,167,69,0.7)', borderColor: 'rgb(40,167,69)', borderWidth: 1 },
                        { label: 'Идеал %', data: sprintData.map(s => s.idealCompletionPercentage), type: 'line', borderColor: 'rgb(23,162,184)', borderDash: [5, 5], pointRadius: 4, fill: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' }, title: { display: true, text: 'Сравнение спринтов' } },

                }
            });
        } catch (error) { console.error('Ошибка Burndown Trend:', error); }
    };
</script>

<script>
    window.triggerDownload = (fileName, base64Content, mimeType) => {
        const link = document.createElement('a');
        link.href = `data:${mimeType};base64,${base64Content}`;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
</script>

<script>
    window.shakeElement = (elementClass) => {
        const el = document.querySelector('.' + elementClass);
        if (el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); }
    };
</script>

<script>
    document.addEventListener('dragover', e => { if (e.target.closest('.drop-zone')) e.preventDefault(); });
    document.addEventListener('dragenter', e => { const d = e.target.closest('.drop-zone'); if (d) d.classList.add('drag-over'); });
    document.addEventListener('dragleave', e => { const d = e.target.closest('.drop-zone'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('drag-over'); });
    document.addEventListener('drop', e => { const d = e.target.closest('.drop-zone'); if (d) d.classList.remove('drag-over'); });
</script>
